name: 올리기 전 자동 점검
on:
  push:
    branches: [main]
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 점검 도구 설치
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: 자동 점검 실행 (가짜 서버·가짜 자료, 운영 자료는 건드리지 않음)
        run: node 점검/check.js
