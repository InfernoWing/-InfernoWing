name: 시험-점검 실패하면 배포 건너뛰나
on:
  push:
    branches: ['시험-점검실패']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: 점검 도구 설치
        run: |
          npm install --no-save playwright
          npx playwright install --with-deps chromium
      - name: 자동 점검 실행 (가짜 서버·가짜 자료, 운영 자료는 건드리지 않음)
        run: node 점검/check.js

  deploy:
    # 점검이 통과해야만 배포합니다. main에 올렸을 때만 배포(pull_request는 점검만).
    needs: check
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: echo '가짜 배포 실행됨 (점검 실패인데 이게 보이면 막지 못한 것)'
